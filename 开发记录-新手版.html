<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开发记录（新手版）— 踩坑学习清单</title>
</head>
<body>
<div id="app" style="max-width:820px;margin:0 auto;padding:16px;font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;color:#1A1B1C;line-height:1.6;">

  <h1 style="font-size:22px;margin:8px 0 2px;">🕳️ 开发记录 · 新手学习清单</h1>
  <p style="font-size:13px;color:#6B7280;margin:0 0 12px;">kb-v2 项目踩过的 21 个坑，每条都讲"人话"。<b>学会一条就勾一条</b>，它会自动移到最后面的"已掌握"区；不想要的可以删除。</p>

  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;padding:12px;border:1px solid rgba(0,0,0,0.1);border-radius:12px;background:#F8F7F4;">
    <div style="font-size:14px;font-weight:600;">进度：<span id="progText">0 / 21</span></div>
    <div style="flex:1;min-width:140px;height:10px;border-radius:6px;background:#E4E3DD;overflow:hidden;">
      <div id="progBar" style="height:100%;width:0%;background:linear-gradient(90deg,#4C6EF5,#52C41A);border-radius:6px;transition:width .3s;"></div>
    </div>
    <button id="undoBtn" onclick="undoDelete()" style="display:none;padding:6px 12px;border:1px solid #4C6EF5;background:#fff;color:#4C6EF5;border-radius:8px;cursor:pointer;font-size:13px;">↩ 撤销删除</button>
    <button onclick="resetAll()" style="padding:6px 12px;border:1px solid #EA6668;background:#fff;color:#EA6668;border-radius:8px;cursor:pointer;font-size:13px;">重置全部</button>
  </div>

  <div style="font-size:13px;color:#6B7280;margin-bottom:8px;">图例：<span style="color:#52C41A;">✅ 已修复</span> · <span style="color:#FAAD14;">⚠️ 已知限制</span> · <span style="color:#F4A340;">🔌 没接上</span> · <span style="color:#4C6EF5;">🟡 约定规避</span></div>

  <h2 id="todoTitle" style="font-size:17px;margin:12px 0 8px;">📚 还没掌握</h2>
  <div id="todoList" style="display:flex;flex-direction:column;gap:10px;"></div>

  <h2 id="doneTitle" style="font-size:17px;margin:20px 0 8px;">✅ 已掌握（勾选的自动到这里）</h2>
  <div id="doneList" style="display:flex;flex-direction:column;gap:10px;"></div>

  <p style="font-size:12px;color:#9AA0B4;margin-top:20px;">数据保存在本浏览器（localStorage），关掉再打开也在。想清空重来点"重置全部"。</p>
</div>

<script>
(function(){
  "use strict";

  // ---------- 21 个坑的数据（新手友好版） ----------
  // status: fixed=已修复 limit=已知限制 wire=没接上 rule=约定规避
  var ITEMS = [
    // ===== 存储与数据层 =====
    {id:"s1", cat:"存储", status:"fixed", title:"笔记切块太大，超过了向量模型的'记忆上限'",
     story:"把笔记切成小块存进知识库时，每块本来能切 750 字，但向量模型一次最多只能记住 512 个 token（约 400 多字）。结果每块的后半截都被'腰斩'了，检索时内容不完整。",
     why:"分块大小是照着旧项目抄的经验值，没查新用的模型到底能装多少。",
     fix:"把分块大小从 750 改成 400 字，给模型留足余量（kb_config.yaml）。",
     lesson:"换模型就要重新核对参数，不能照抄旧经验；'差不多'会变成数据问题。"},
    {id:"s2", cat:"存储", status:"fixed", title:"两个文件夹里的同名文件互相'打架'",
     story:"topicA/同名.md 和 topicB/同名.md 同时存在时，删除其中一篇，另一篇的碎片也被一起删了。",
     why:"存数据时只记了文件名（同名.md），没记它在哪个文件夹——就像两个人身份证都写'张三'，根本分不清谁是谁。",
     fix:"改成用完整路径当'身份证'（topicA/同名.md），删除时按路径精确删，再兼容清理旧数据。",
     lesson:"存数据时标识要全局唯一，别只用名字，要带'户口地址'。"},
    {id:"s3", cat:"存储", status:"limit", title:"台账文件被 git 盯上了，每次入库都提示'有修改'",
     story:"每次跑完入库，git 就显示台账文件 doc_index.json 变了，其实它只是自动生成的数据，不该进版本库。",
     why:".gitignore 忽略了向量库和缓存目录，唯独漏了台账目录。",
     fix:"把 knowledge/index/ 加进 .gitignore 即可（还没处理）。",
     lesson:"程序自动生成的数据文件，一律别进 git，不然每次运行都是噪音。"},
    {id:"s4", cat:"存储", status:"limit", title:"超长段落会被整段硬塞进一个块",
     story:"如果笔记里有一段特别长（超过 400 字），切块程序不会把它切开，而是整段塞进去，导致这个'块'又大又笨。",
     why:"切块逻辑对'超长段落'没有兜底分支。",
     fix:"未来在段落内部再按句子二次切分（还没做）。",
     lesson:"写处理逻辑时要想到'输入不规整'的情况，留个兜底。"},

    // ===== Agent 与 LLM 层 =====
    {id:"a1", cat:"AI问答", status:"fixed", title:"IDE 手滑，多打了一行没用的代码",
     story:"代码编辑器自动补全时手滑，给问答程序加了一行没人用的导入。程序居然能跑，因为那个库碰巧被别的依赖装上了。",
     why:"IDE 自动补全的'事故'，加上没人检查 diff 里多出来的行。",
     fix:"删掉那行没用的导入（代码评审时发现的）。",
     lesson:"提交前看一眼自己改了什么；'能跑'不等于'代码是对的'。"},
    {id:"a2", cat:"AI问答", status:"fixed", title:"明明找到了答案，却误判成'没找到'",
     story:"一个问题拆成好几个词去搜，搜完合并到一起，但没按分数排序就拿了第一个判断——第一个恰好分低，系统就以为'没找到'，白白去网上搜。",
     why:"合并多路搜索结果后忘了排序，却直接看'第一个'的分数。",
     fix:"合并后先按相似度从高到低排序；返回答案前再用最高分判断一次（双保险）。",
     lesson:"多路结果合并后必须排序，判断要基于'最好的那个'，不是'第一个'。"},
    {id:"a3", cat:"AI问答", status:"fixed", title:"检索没命中时，把工具算好的结果弄丢了",
     story:"你问'2 的 10 次方'，程序先查知识库——没查到，就自动去调计算工具。结果工具算出了 1024，但程序在'没资料'分支里提前返回，把 1024 丢了，最后只能说'凭常识大概是 1024'。",
     why:"判断'有没有料'时只看了检索结果，没把工具结果算进去；而工具结果恰恰在检索落空时最有用。",
     fix:"改成：检索结果或工具结果，只要有一样就不算'没资料'。",
     lesson:"判断有没有材料，要检查所有来源，不能只盯一条路。"},
    {id:"a4", cat:"AI问答", status:"fixed", title:"审查员看不见工具结果，把对的答案打回去重写",
     story:"多 Agent 流程里有个'审查员'负责检查答案有没有依据。但审查员只看了检索到的资料，看不到工具算出的结果——于是工具型答案被判'没依据'，打回重写。",
     why:"审查员的'参考材料'和回答者的'输入材料'不一致。",
     fix:"审查时把工具结果也拼进参考材料里。",
     lesson:"审查的人/程序，看到的材料必须比干活的人更全，否则会冤枉人。"},
    {id:"a5", cat:"AI问答", status:"limit", title:"每次提问都多问一次 AI'要不要用工具'",
     story:"就算知识库里已经找到了答案，程序还是多一步：问 AI 要不要调用工具。多花一次调用、多等几秒。",
     why:"流程图里这条线是固定的，不管有没有资料都走一遍。",
     fix:"未来改成：有答案就直接答，只有没找到/需要计算时才问工具（还没做）。",
     lesson:"流程里'每步都跑'和'按需跑'差别很大，想清楚哪些步骤可以跳过。"},
    {id:"a6", cat:"AI问答", status:"fixed", title:"给子进程的代码模板用错了拼接方式",
     story:"程序要在一个'小房间'（子进程）里执行用户代码。模板代码里有一句'出错时显示错误类型'——但用 f-string 拼接时，这句在'外面'就被提前执行了，结果子进程里反而拿不到错误信息。",
     why:"模板里'运行时才该计算'的部分，被父进程提前展开求值了。",
     fix:"模板改用普通字符串拼接，把错误类型的计算留到子进程里执行。",
     lesson:"跨进程传代码时，'该在那边算的'绝对不要提前算，要分清拼接时机。"},
    {id:"a7", cat:"AI问答", status:"fixed", title:"用'线程'跑代码，超时杀不死",
     story:"执行用户代码用线程实现，遇到死循环或失控代码，超时后杀不掉，还可能把整个程序拖垮。",
     why:"线程超时只是'提醒'，控制不了已经在跑的失控代码。",
     fix:"改成用'子进程'跑（subprocess + 超时），超时直接终止进程，互不影响；还处理了语法错误、崩溃退出码等情况。",
     lesson:"执行不可信的代码要按'进程'隔离，不是线程——就像把危险品放独立仓库而不是自家客厅。"},
    {id:"a8", cat:"AI问答", status:"fixed", title:"AI 返回空内容时没防护",
     story:"调 AI 接口偶尔会返回空结果，程序直接拿空内容用，会出问题。",
     why:"没考虑外部服务'什么都没返回'的情况。",
     fix:"空响应统一按'没有结果'处理，mock 模式（没配 key 时）也走安全分支。",
     lesson:"外部服务的返回永远要防空，调用方要有默认兜底。"},

    // ===== 会话与记忆 =====
    {id:"m1", cat:"聊天记录", status:"fixed", title:"会话文件名多了个重复前缀",
     story:"每个聊天会话有个编号（s_abc123），存文件时又自动加了一遍 s_，结果文件名变成 s_s_abc123.json。程序内部自己调用没事，但任何'按编号找文件'的外部代码都会找不到。",
     why:"生成编号和拼文件名各加了一次前缀，两边约定不一致。",
     fix:"拼文件名时去掉重复的前缀，编号风格保持不变。",
     lesson:"'碰巧自己能跑'的代码是隐藏地雷，换个人或换个调用方式就炸。"},
    {id:"m2", cat:"聊天记录", status:"fixed", title:"改存储格式没做兼容，老聊天记录差点丢",
     story:"修完上面的 bug 后，以前存的老格式文件会'找不到'，聊天记录可能静默丢失。",
     why:"改了文件命名规则，但没处理老文件。",
     fix:"加了一段一次性迁移代码：启动时自动把老文件按新规则改名（幂等、只跑一次）。",
     lesson:"改存储格式必须带迁移，宁可多写代码也别丢用户数据。"},
    {id:"m3", cat:"聊天记录", status:"wire", title:"长期记忆模块写好了，但没接进问答",
     story:"代码里有个'长期记忆'模块（记住用户偏好、目标），读写功能都写完了，但没有任何地方调用它——问答流程完全没用到，记忆文件也从来没生成过。",
     why:"写了数据层就以为完成了，忘了'接线'进主流程。",
     fix:"未来把记忆接进问答：提问前把记忆内容塞给 AI，回答后自动提炼新事实存进去（还没做）。",
     lesson:"数据层写完 ≠ 功能完成。模块没接进主流程就是死代码，等于没做。"},

    // ===== Web 与前端 =====
    {id:"w1", cat:"网页", status:"rule", title:"Windows 控制台打印 emoji 会崩",
     story:"在 Windows 的黑色命令行里打印 📁 这类表情符号，会直接报编码错误，严重时整个网页接口报 500。",
     why:"Windows 控制台默认用 GBK 编码，不认 emoji。",
     fix:"约定：代码里打印日志一律用纯文字标记（如 [上传]），不碰 emoji。",
     lesson:"跨平台写代码，日志输出用最朴素的字符最稳。"},
    {id:"w2", cat:"网页", status:"fixed", title:"前端脚本有一个语法错误，整个网页全失灵",
     story:"网页的前端 JS 里有一个小语法错误，导致整个页面报错：上传不能用、提问不能用、什么按钮都没反应。",
     why:"改了前端代码但没做语法检查，也没在浏览器里验证。",
     fix:"修复语法错误，并加了 node --check 语法校验。",
     lesson:"前端改完必须验证，'看着对'不等于'浏览器不报错'。"},
    {id:"w3", cat:"网页", status:"rule", title:"向量库的遥测噪音",
     story:"用向量库组件时，控制台会打出一些遥测相关的报错噪音，不影响功能但很烦。",
     why:"第三方库默认开了匿名遥测，环境里打印报错。",
     fix:"设置环境变量 ANONYMIZED_TELEMETRY=False 关掉。",
     lesson:"第三方库的环境级小坑记一笔，省得每次困惑。"},

    // ===== 依赖与工程 =====
    {id:"e1", cat:"工程", status:"fixed", title:"两个库版本打架，AI 客户端崩了",
     story:"装依赖时没锁版本，结果 httpx 更新到新版后，openai 库调用就崩。",
     why:"httpx 0.28 删了一个旧参数，openai 旧版本不兼容。",
     fix:"在 requirements.txt 里锁住 httpx&lt;0.28，并注释写明原因。",
     lesson:"锁版本一定要写原因注释，不然后人看到会以为是多余的、删掉又崩。"},
    {id:"e2", cat:"工程", status:"fixed", title:"上传的文件名没检查，可能被'路径穿越'攻击",
     story:"用户上传文件的文件名如果直接拿去拼路径，构造 ../ 这种名字就可能写到知识库外面去。",
     why:"用户输入没校验就拼路径，本地工具也要防。",
     fix:"加白名单校验：文件名不允许带 /、\\、.. 等任何路径成分，主题名也只允许单层目录。",
     lesson:"任何'用户输入 → 拼路径'的地方都要净化，本地项目也不例外。"},
    {id:"e3", cat:"工程", status:"rule", title:"待审查文件放错位置会被误入库",
     story:"上传的文件先进'待审查区'，等人工确认。如果待审查区放在笔记目录里，程序扫描时会把没确认的文件也入库。",
     why:"扫描器会递归扫整个笔记目录。",
     fix:"把待审查区放在笔记目录外面，物理隔离，从根上避免误扫。",
     lesson:"扫描类程序，'待处理区'要和'正式区'隔开，不能靠口头约定。"},
  ];

  var LS_KEY = "kb_devlog_v1";
  var state = { learned: [], deleted: [] };
  var lastDeleted = null;

  // ---------- 渲染 ----------
  function render(){
    var todo = document.getElementById("todoList");
    var done = document.getElementById("doneList");
    todo.innerHTML = "";
    done.innerHTML = "";
    var doneCount = 0;
    ITEMS.forEach(function(it){
      if (state.deleted.indexOf(it.id) >= 0) return;
      var node = makeCard(it);
      if (state.learned.indexOf(it.id) >= 0) { done.appendChild(node); doneCount++; }
      else { todo.appendChild(node); }
    });
    var total = ITEMS.length - state.deleted.length;
    document.getElementById("progText").textContent = doneCount + " / " + total;
    document.getElementById("progBar").style.width = (total ? (doneCount/total*100) : 0) + "%";
    document.getElementById("todoTitle").style.display = (todo.children.length ? "" : "none");
    document.getElementById("doneTitle").style.display = (done.children.length ? "" : "none");
    document.getElementById("undoBtn").style.display = (lastDeleted ? "" : "none");
  }

  function makeCard(it){
    var card = document.createElement("div");
    card.style.cssText = "border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px 14px;background:#fff;";
    var stColor = {fixed:"#52C41A", limit:"#FAAD14", wire:"#F4A340", rule:"#4C6EF5"}[it.status] || "#6B7280";
    var stText = {fixed:"✅ 已修复", limit:"⚠️ 已知限制", wire:"🔌 没接上", rule:"🟡 约定规避"}[it.status] || it.status;

    var head = document.createElement("div");
    head.style.cssText = "display:flex;align-items:flex-start;gap:10px;";
    head.innerHTML =
      '<input type="checkbox" title="学会了勾这里" style="width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:#52C41A;cursor:pointer;">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;">' +
          '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:#EFF1F5;color:#4C6EF5;">' + it.cat + '</span>' +
          '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:#F2F2F0;color:' + stColor + ';border:1px solid ' + stColor + ';">' + stText + '</span>' +
        '</div>' +
        '<div style="font-size:14px;font-weight:600;">' + it.title + '</div>' +
        '<details style="margin-top:6px;">' +
          '<summary style="font-size:12px;color:#4C6EF5;cursor:pointer;user-select:none;">👀 展开看发生了什么</summary>' +
          '<div style="font-size:13px;color:#333;margin-top:6px;line-height:1.7;">' +
            '<div><b>事情经过：</b>' + it.story + '</div>' +
            '<div style="margin-top:4px;"><b>为啥会这样：</b>' + it.why + '</div>' +
            '<div style="margin-top:4px;"><b>怎么解决的：</b>' + it.fix + '</div>' +
            '<div style="margin-top:4px;"><b>学到的道理：</b>' + it.lesson + '</div>' +
          '</div>' +
        '</details>' +
      '</div>';

    var delBtn = document.createElement("button");
    delBtn.textContent = "删除";
    delBtn.title = "从清单里删掉这条";
    delBtn.style.cssText = "flex:0 0 auto;padding:6px 10px;border:1px solid #EA6668;background:#fff;color:#EA6668;border-radius:8px;cursor:pointer;font-size:12px;";
    delBtn.onclick = function(){
      if (!confirm("确定删除这条吗？\n「" + it.title + "」")) return;
      state.deleted.push(it.id);
      if (state.learned.indexOf(it.id) >= 0) state.learned.splice(state.learned.indexOf(it.id), 1);
      lastDeleted = it.id;
      save(); render();
    };

    var cb = head.querySelector("input[type=checkbox]");
    cb.checked = (state.learned.indexOf(it.id) >= 0);
    cb.onchange = function(){
      var idx = state.learned.indexOf(it.id);
      if (cb.checked) { if (idx < 0) state.learned.push(it.id); }
      else { if (idx >= 0) state.learned.splice(idx, 1); }
      save(); render();
    };

    head.appendChild(delBtn);
    card.appendChild(head);
    return card;
  }

  function undoDelete(){
    if (!lastDeleted) return;
    var idx = state.deleted.indexOf(lastDeleted);
    if (idx >= 0) state.deleted.splice(idx, 1);
    lastDeleted = null;
    save(); render();
  }

  function resetAll(){
    if (!confirm("确定清空所有勾选和删除，恢复初始 21 条吗？")) return;
    state = { learned: [], deleted: [] };
    lastDeleted = null;
    localStorage.removeItem(LS_KEY);
    render();
  }

  function save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  }

  function load(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          state.learned = (d.learned||[]).filter(function(id){ return ITEMS.some(function(it){ return it.id===id; }); });
          state.deleted = (d.deleted||[]).filter(function(id){ return ITEMS.some(function(it){ return it.id===id; }); });
        }
      }
    } catch(e){}
  }

  // ---------- 暴露到全局（内联 onclick 用） ----------
  window.undoDelete = undoDelete;
  window.resetAll = resetAll;

  load();
  render();
})();
</script>
