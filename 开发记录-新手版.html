     lesson:"锁版本一定要写原因注释，不然后人看到会以为是多余的、删掉又崩。"},
    {id:"e2", cat:"工程", status:"fixed", title:"上传的文件名没检查，可能被'路径穿越'攻击",
     story:"用户上传文件的文件名如果直接拿去拼路径，构造 ../ 这种名字就可能写到知识库外面去。",
     why:"用户输入没校验就拼路径，本地工具也要防。",
     fix:"加白名单校验：文件名不允许带 /、\\、.. 等任何路径成分，主题名也只允许单层目录。",
     lesson:"任何'用户输入 → 拼路径'的地方都要净化，本地项目也不例外。"},
    {id:"e3", cat:"工程", status:"rule", title:"待审查文件放错位置会被误入库",
     story:"上传的文件先进'待审查区'，等人工确认。如果待审查区放在笔记目录里，程序扫描时会把没确认的文件也入库。",
     why:"扫描器会递归扫整个笔记目录。",
     fix:"把待审查区放在笔记目录外面，物理隔离，从根上避免误扫。",
     lesson:"扫描类程序，'待处理区'要和'正式区'隔开，不能靠口头约定。"},
    {id:"e4", cat:"工程", status:"rule", title:"同一台电脑两套 Python 在'接力'跑同一个项目",
     story:"服务莫名 hang、入库超慢。查进程才发现：系统 Python 和项目虚拟环境的 Python 同时在跑——一个在 sleep 等锁，一个在拼命运算，互相卡住，内存还翻倍。",
     why:"项目装了 venv，但系统里还有一套 Python；终端、PATH 或 IDE 不同，就会用到不同的解释器。",
     fix:"约定：一切命令只用项目 venv 的解释器；遇到 hang 先查进程列表有没有双开。",
     lesson:"一个项目只能有一套运行环境，'环境漂移'造成的故障最难查。"},
    {id:"e5", cat:"工程", status:"fixed", title:"以为删干净了，其实删除命令被'保安'拦下了",
     story:"以为'全量重建'把旧向量库清空了，后来才发现旧数据还在——删除命令被环境里的安全脚本拦截、静默失败，代码没察觉就继续跑了。",
     why:"环境装了'安全删除'钩子，所有删文件操作都改道回收站，失败时抛的异常没被上层感知。",
     fix:"核对真实数据时发现残留，改用直接操作底层数据库的方式清理；养成习惯：清理类操作做完必须验证结果。",
     lesson:"'没报错'不等于'成功了'，破坏性/清理性操作必须回读验证。"},

    // ===== 测试与调试 =====
    {id:"t1", cat:"测试", status:"fixed", title:"lambda 不能'寄'给子进程",
     story:"写并发测试时把任务写成 lambda 传给子进程，直接报 PicklingError（无法序列化）。",
     why:"子进程靠'序列化'接收任务——把函数打包寄过去。lambda 是匿名函数，没名字，寄不出去。",
     fix:"把任务写成模块顶层的普通函数，有名字就能寄。",
     lesson:"多进程编程里，传给子进程的东西必须'有名字、找得到'。"},
    {id:"t2", cat:"测试", status:"fixed", title:"一个测试弄脏了环境，后面的测试连环挂",
     story:"并发测试为了用临时目录，改了全局配置但没改回来。它自己通过了，排在它后面的检索测试却全军覆没——它们还在用被改掉的目录。",
     why:"测试之间共享全局状态，改完没还原，污染了后面所有无辜的测试。",
     fix:"用 try/finally 保证'用完一定还原'，不管测试成功还是失败。",
     lesson:"测试借全局状态必须'借完归还'，否则故障会出现在八竿子打不着的下游。"},
    {id:"t3", cat:"测试", status:"rule", title:"后台脚本'装死'，其实早就跑完了",
     story:"后台跑入库，半天看不到进度输出，以为卡死了，差点杀掉重跑。实际它 8.9 秒就跑完了——只是后台模式的输出被缓冲住，一个字都看不见。",
     why:"输出到管道时会攒够一批才显示，不是实时打印；Windows 上尤其明显。",
     fix:"想看实时进度就加 -u（无缓冲）参数，或同步前台跑一次验证。",
     lesson:"'看不到输出'不等于'没在干活'，先确认是真卡了还是只是没打印。"},
  ];

  var LS_KEY = "kb_devlog_v1";
  var state = { learned: [], deleted: [] };
  var lastDeleted = null;

  // ---------- 渲染 ----------
  function render(){
    var todo = document.getElementById("todoList");
    var done = document.getElementById("doneList");
    todo.innerHTML = "";
    done.innerHTML = "";
    var doneCount = 0;
    ITEMS.forEach(function(it){
      if (state.deleted.indexOf(it.id) >= 0) return;
      var node = makeCard(it);
      if (state.learned.indexOf(it.id) >= 0) { done.appendChild(node); doneCount++; }
      else { todo.appendChild(node); }
    });
    var total = ITEMS.length - state.deleted.length;
    document.getElementById("progText").textContent = doneCount + " / " + total;
    document.getElementById("progBar").style.width = (total ? (doneCount/total*100) : 0) + "%";
    document.getElementById("todoTitle").style.display = (todo.children.length ? "" : "none");
    document.getElementById("doneTitle").style.display = (done.children.length ? "" : "none");
    document.getElementById("undoBtn").style.display = (lastDeleted ? "" : "none");
  }

  function makeCard(it){
    var card = document.createElement("div");
    card.style.cssText = "border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px 14px;background:#fff;";
    var stColor = {fixed:"#52C41A", limit:"#FAAD14", wire:"#F4A340", rule:"#4C6EF5"}[it.status] || "#6B7280";
    var stText = {fixed:"✅ 已修复", limit:"⚠️ 已知限制", wire:"🔌 没接上", rule:"🟡 约定规避"}[it.status] || it.status;

    var head = document.createElement("div");
    head.style.cssText = "display:flex;align-items:flex-start;gap:10px;";
    head.innerHTML =
      '<input type="checkbox" title="学会了勾这里" style="width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:#52C41A;cursor:pointer;">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;">' +
          '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:#EFF1F5;color:#4C6EF5;">' + it.cat + '</span>' +
          '<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:#F2F2F0;color:' + stColor + ';border:1px solid ' + stColor + ';">' + stText + '</span>' +
        '</div>' +
        '<div style="font-size:14px;font-weight:600;">' + it.title + '</div>' +
        '<details style="margin-top:6px;">' +
          '<summary style="font-size:12px;color:#4C6EF5;cursor:pointer;user-select:none;">👀 展开看发生了什么</summary>' +
          '<div style="font-size:13px;color:#333;margin-top:6px;line-height:1.7;">' +
            '<div><b>事情经过：</b>' + it.story + '</div>' +
            '<div style="margin-top:4px;"><b>为啥会这样：</b>' + it.why + '</div>' +
            '<div style="margin-top:4px;"><b>怎么解决的：</b>' + it.fix + '</div>' +
            '<div style="margin-top:4px;"><b>学到的道理：</b>' + it.lesson + '</div>' +
          '</div>' +
        '</details>' +
      '</div>';

    var delBtn = document.createElement("button");
    delBtn.textContent = "删除";
    delBtn.title = "从清单里删掉这条";
    delBtn.style.cssText = "flex:0 0 auto;padding:6px 10px;border:1px solid #EA6668;background:#fff;color:#EA6668;border-radius:8px;cursor:pointer;font-size:12px;";
    delBtn.onclick = function(){
      if (!confirm("确定删除这条吗？\n「" + it.title + "」")) return;
      state.deleted.push(it.id);
      if (state.learned.indexOf(it.id) >= 0) state.learned.splice(state.learned.indexOf(it.id), 1);
      lastDeleted = it.id;
      save(); render();
    };

    var cb = head.querySelector("input[type=checkbox]");
    cb.checked = (state.learned.indexOf(it.id) >= 0);
    cb.onchange = function(){
      var idx = state.learned.indexOf(it.id);
      if (cb.checked) { if (idx < 0) state.learned.push(it.id); }
      else { if (idx >= 0) state.learned.splice(idx, 1); }
      save(); render();
    };

    head.appendChild(delBtn);
    card.appendChild(head);
    return card;
  }

  function undoDelete(){
    if (!lastDeleted) return;
    var idx = state.deleted.indexOf(lastDeleted);
    if (idx >= 0) state.deleted.splice(idx, 1);
    lastDeleted = null;
    save(); render();
  }

  function resetAll(){
    if (!confirm("确定清空所有勾选和删除，恢复初始 31 条吗？")) return;
    state = { learned: [], deleted: [] };
    lastDeleted = null;
    localStorage.removeItem(LS_KEY);
    render();
  }

  function save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  }

  function load(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          state.learned = (d.learned||[]).filter(function(id){ return ITEMS.some(function(it){ return it.id===id; }); });
          state.deleted = (d.deleted||[]).filter(function(id){ return ITEMS.some(function(it){ return it.id===id; }); });
        }
      }
    } catch(e){}
  }

  // ---------- 暴露到全局（内联 onclick 用） ----------
  window.undoDelete = undoDelete;
  window.resetAll = resetAll;

  load();
  render();
})();
</script>
</body>
</html>
