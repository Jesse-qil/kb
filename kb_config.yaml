# ========== kb-v2 知识库独立配置 ==========
# 笔记目录：把 .md/.docx 丢进 raw 下的子目录即可（顶层目录 = 领域/大分类）
scan:
  raw_root: raw            # 相对 knowledge/ 的扫描根（raw 原始层）
  compiled_root: compiled_wiki   # 范式3预留：AI 编译产物（当前不用）
  enable_compiled_layer: false    # 当前关闭编译层
  file_suffix: [".md", ".docx", ".pdf"]
  exclude_dirs: []                # 黑名单（可选）

split:
  chunk_size: 400          # 每个片段最大字数（bge-small-zh 512 token 上限，中文约 1字≈1token）
  chunk_overlap: 120       # 相邻片段重叠字数，避免切断语义

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"

recall:
  top_k: 4                 # 每次提问检索几个相关片段
  score_threshold: 0.45    # 低于此相似度视为"没找到"（bge-small-zh 正常命中多在 0.45~0.62；
                           # 0.6 会把大量正解拒掉转联网；标签融合分上限 +0.12 已并入 score）

# ===== 大模型配置（OpenAI 兼容接口，多提供商可切换） =====
# provider: deepseek / openai / siliconflow / ollama / mock / auto
# auto = 自动识别 .env 里配了哪家 key 就用哪家，都没有 → mock（假回答跑通流程）
llm:
  provider: auto
  temperature: 0.3

# ===== Web 服务 =====
server:
  host: "127.0.0.1"
  port: 8000
  reload: true           # 开发期热重载；部署改 false

# ===== 会话窗口 =====
session:
  max_turns: 6           # 喂给 LLM 的对话轮数（文件里仍保留完整历史）

# ===== 多 Agent 流程 =====
agent:
  max_review_rounds: 3   # Reviewer 打回重写上限（防死循环）
  tool_max_rounds: 5     # Function Calling 工具循环上限
  query_top_k: 3         # 每条子查询检索片段数
  tag_match_top_n: 3     # Planner 没给标签时，embedding 语义补匹配几个标签
  tag_match_threshold: 0.45

# ===== 打标签（标签自治） =====
# 分层阈值由 scripts/tag_sim_probe.py 实测校准：
# 101 篇文档与 35 个标签的 Top1 相似度 p50=0.597、max=0.741
tagger:
  max_tags: 6            # 每篇文档标签数上限
  retrieve_top_k: 5      # 标签库检索候选数
  reuse_min: 0.60        # 最高相似度 ≥ 此值 → 直接复用标签，不调 LLM
  gray_min: 0.45         # 最高相似度 < 此值 → 全新领域，LLM 生成新标签并写回
