<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 个人知识库</title>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/index.css">
</head>
<body>

<!-- ===== 左侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo">📚</div>
    <h1>个人知识库</h1>
  </div>

  <!-- 页面导航 -->
  <a class="nav-item active" href="/static/index.html">💬 问答对话</a>
  <a class="nav-item" href="/static/manage.html">🗂 知识库管理</a>
  <a class="nav-item" href="/static/eval_dashboard.html">📊 评估仪表盘</a>

  <button class="new-sess-btn" onclick="newSession()">＋ 新建会话</button>

  <div class="session-list-wrap">
    <div id="sessionList"></div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="kb-section">
    <div class="kb-title">知识库</div>
    <button id="pendingBtn" class="pending-btn" onclick="togglePending()" style="display:none">
      📋 待审查 <span id="pendingCount" class="dot-badge">0</span>
    </button>
  </div>

  <div class="sidebar-footer" id="stats"></div>
</aside>

<div class="sidebar-mask" id="sidebarMask" onclick="toggleSidebar()"></div>

<!-- ===== 主区 ===== -->
<main class="main-area">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title">💬 <span id="curSessName">新会话</span></div>
    <div style="flex:1"></div>
    <button class="topbar-btn" onclick="exportSession()" title="导出当前会话为 Markdown">⬇ 导出</button>
  </div>

  <div id="pendingPanel" class="panel">
    <div class="panel-inner">
      <h3>📋 待审查文件（确认后才会入库）</h3>
      <div id="pendingList"></div>
    </div>
  </div>

  <div id="progWrap" class="panel" style="padding:10px 22px 12px">
    <div class="prog-card">
      <div class="prog-top"><span id="progStage">准备中…</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><div id="progBar" class="prog-fill"></div></div>
      <div class="prog-bottom">
        <span id="progCurrent" class="prog-current"></span>
        <span id="progTime">用时 0:00 · 剩余 --</span>
      </div>
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat" id="chat">
      <div class="welcome">
        <div class="wl-logo">📚</div>
        <h2>个人知识库</h2>
        <p>问任何关于你笔记的问题，回答会流式生成</p>
        <div class="sugg">
          <button class="sugg-btn" onclick="sendSugg('知识库里有什么内容？')">📖 库里有什么</button>
          <button class="sugg-btn" onclick="sendSugg('list 和 tuple 有什么区别？')">🐍 Python 基础</button>
          <button class="sugg-btn" onclick="sendSugg('LangGraph 多智能体怎么做？')">🤖 AI-Agent</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-box">
      <textarea id="question" rows="1" placeholder="问点什么，比如：list 和 tuple 有什么区别？" autocomplete="off"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<script src="/static/js/common.js"></script>
<script src="/static/js/index.js"></script>
</body>
</html>
