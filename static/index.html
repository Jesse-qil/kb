<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 个人知识库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #1e1e2e;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .navbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    background: #2a2a3c;
    border-bottom: 1px solid #3a3a52;
  }
  .navbar h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .navbar .actions { display: flex; align-items: center; gap: 12px; }
  .navbar button {
    background: #4c6ef5; color: #fff; border: none;
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
    font-size: 13px;
  }
  .navbar button:hover { background: #3b5bdb; }
  #stats { font-size: 13px; color: #9aa0b4; }

  .chat-wrap { flex: 1; overflow-y: auto; }
  .chat {
    max-width: 760px; margin: 0 auto; padding: 24px 20px 40px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; white-space: pre-wrap; font-size: 15px; }
  .user { align-self: flex-end; background: #4c6ef5; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #2a2a3c; color: #e8e8f0; border-bottom-left-radius: 4px; }
  .source { align-self: flex-start; font-size: 12px; color: #7a8096; padding: 0 4px; }
  .choice-box { align-self: flex-start; display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .choice-btn {
    background: #2a2a3c; color: #e8e8f0; border: 1px solid #4c6ef5;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-size: 13px; text-align: left;
  }
  .choice-btn:hover { background: #3b5bdb; color: #fff; }
  .welcome { text-align: center; color: #9aa0b4; margin-top: 15vh; font-size: 15px; }
  .welcome h2 { color: #fff; margin-bottom: 8px; font-size: 22px; }

  .input-bar { padding: 16px 24px 24px; background: #1e1e2e; }
  .input-box {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 10px;
    background: #2a2a3c;
    border: 1px solid #3a3a52;
    border-radius: 12px;
    padding: 10px 14px;
  }
  .input-box:focus-within { border-color: #4c6ef5; }
  #question {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e8e8f0; font-size: 15px;
  }
  #question::placeholder { color: #6a7088; }
  #sendBtn {
    background: #4c6ef5; color: #fff; border: none;
    padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #sendBtn:hover { background: #3b5bdb; }
  #sendBtn:disabled { background: #3a3a52; cursor: not-allowed; }
</style>
</head>
<body>

<div class="navbar">
  <h1>📚 个人知识库</h1>
  <div class="actions">
    <span id="stats"></span>
    <label style="font-size:13px;color:#9aa0b4;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="autoMode" style="accent-color:#4c6ef5"> 自动入库
    </label>
    <button onclick="document.getElementById('fileInput').click()">📤 上传笔记</button>
    <input type="file" id="fileInput" accept=".md,.docx,.pdf" multiple style="display:none" onchange="upload()">
    <button onclick="importFolder()" title="导入服务器本地文件夹，自动识别知识文件">📁 导入文件夹</button>
    <button onclick="ingest()">🔄 重新导入</button>
    <button id="pendingBtn" onclick="togglePending()" style="display:none">📋 待审查 <span id="pendingCount">0</span></button>
    <div style="position:relative">
      <button onclick="toggleSessions()" title="会话管理">💬 会话 <span id="curSessName" style="font-weight:400;color:#9aa0b4"></span></button>
      <div id="sessionPanel" style="display:none;position:absolute;right:0;top:34px;background:#2a2a3c;border:1px solid #3a3a52;border-radius:10px;min-width:260px;max-height:320px;overflow-y:auto;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4)">
        <div style="padding:8px 10px;border-bottom:1px solid #3a3a52">
          <button onclick="newSession()" style="width:100%;background:#4c6ef5;color:#fff;border:none;padding:6px;border-radius:8px;cursor:pointer">＋ 新建会话</button>
        </div>
        <div id="sessionList" style="padding:4px"></div>
      </div>
    </div>
  </div>
</div>

<div id="pendingPanel" style="display:none;background:#2a2a3c;border-bottom:1px solid #3a3a52;padding:12px 24px">
  <div style="max-width:760px;margin:0 auto">
    <h3 style="font-size:15px;color:#fff;margin-bottom:10px">📋 待审查文件（确认后才会入库）</h3>
    <div id="pendingList"></div>
  </div>
</div>

<div id="progWrap" style="display:none;padding:10px 24px 0">
  <div style="max-width:760px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#9aa0b4;margin-bottom:4px">
      <span id="progStage">准备中…</span>
      <span id="progPct">0%</span>
    </div>
    <div style="background:#2a2a3c;border-radius:8px;height:10px;overflow:hidden">
      <div id="progBar" style="width:0%;height:100%;background:linear-gradient(90deg,#4c6ef5,#69db7c);transition:width .3s"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#7a8096;margin-top:6px;align-items:center">
      <span id="progCurrent" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%"></span>
      <span id="progTime" style="flex-shrink:0">用时 0:00 · 剩余 --</span>
    </div>
  </div>
</div>

<div class="chat-wrap">
  <div class="chat" id="chat">
    <div class="welcome">
      <h2>📚 个人知识库</h2>
      <p>问我关于你笔记的任何问题</p>
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="input-box">
    <input id="question" placeholder="问点什么，比如：list 和 tuple 有什么区别？" autocomplete="off">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const chatEl = document.getElementById("chat");
const sendBtn = document.getElementById("sendBtn");

function addMsg(text, cls) {
  const welcome = document.querySelector(".welcome");
  if (welcome) welcome.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;

  // 检测【选择】块 → 拆成"说明文字 + 选项按钮"
  const m = text.match(/【选择】\n?([\s\S]*)$/);
  if (m) {
    div.textContent = text.replace(/【选择】\n?[\s\S]*$/, "").trim();
    chatEl.appendChild(div);
    // 渲染选项按钮
    const box = document.createElement("div");
    box.className = "choice-box";
    m[1].split("\n").forEach(line => {
      const t = line.replace(/^\s*\d+[.、]\s*/, "").trim();   // 去掉"1. "编号
      if (!t) return;
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = t;
      btn.onclick = () => sendChoice(t);                        // 点击 → 发送
      box.appendChild(btn);
    });
    chatEl.appendChild(box);
  } else {
    div.textContent = text;
    chatEl.appendChild(div);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

function sendChoice(text) {
  const input = document.getElementById("question");
  input.value = text;
  send();
}

async function upload() {
  const input = document.getElementById("fileInput");
  if (!input.files.length) return;
  const files = Array.from(input.files);
  const auto = document.getElementById("autoMode").checked;
  const names = files.map(f => f.name).join("、");
  addMsg((auto ? "🤖" : "📤") + " 正在上传" + (auto ? "（自动入库）" : "（待审查）") + "：" + names, "user");

  // 一次请求批量传所有文件（后端 files: list[UploadFile]）
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  fd.append("auto", auto ? "1" : "0");

  let doneNames = [], pendingNames = [], dupMsg = [], errMsg = "";
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await res.json();
    (data.results || []).forEach(r => {
      if (r.status === "done") {
        doneNames.push(r.filename + " → [" + (r.topic || "默认") + "]");
      } else if (r.status === "pending") {
        pendingNames.push(r.filename + (r.suggest_topic ? " → 建议[" + r.suggest_topic + "]" : " → 主题待定"));
      } else if (r.status === "duplicate") {
        dupMsg.push(r.filename + "（" + (r.error || "重复") + "）");
      } else {
        errMsg.push(r.filename + "：" + (r.error || "失败"));
      }
    });
    if (data.ingest_started) pollIngest();
  } catch (e) {
    errMsg.push("请求失败：" + e);
  }

  if (doneNames.length) addMsg("🤖 自动入库中：" + doneNames.join("、"), "bot");
  if (pendingNames.length) addMsg("📋 已进入待审查：" + pendingNames.join("、") + "。点击右上角「待审查」确认入库。", "bot");
  if (dupMsg.length) addMsg("🔁 已跳过重复：" + dupMsg.join("、"), "bot");
  if (errMsg.length) addMsg("⚠️ 失败：" + errMsg.join("；"), "bot");
  input.value = "";
  refreshPending();
}

// ---- 文件夹导入（服务器本地路径）----
async function importFolder() {
  const path = prompt("输入要导入的本地文件夹路径（自动识别 .md/.docx/.pdf）：");
  if (!path || !path.trim()) return;
  const auto = document.getElementById("autoMode").checked;
  addMsg((auto ? "📁" : "📁") + " 正在导入文件夹（" + (auto ? "自动入库" : "待审查") + "）：" + path.trim(), "user");
  let doneNames = [], pendingNames = [], dupMsg = [], errMsg = [];
  try {
    const res = await fetch("/api/import/folder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path.trim(), auto: auto })
    });
    const data = await res.json();
    if (!res.ok) {
      errMsg.push(data.detail || "导入失败");
    } else {
      const s = data.summary || {};
      (s.details || []).forEach(d => {
        if (d.status === "done") doneNames.push(d.file + " → [" + (d.topic || "默认") + "]");
        else if (d.status === "pending") pendingNames.push(d.file + (d.suggest_topic ? " → 建议[" + d.suggest_topic + "]" : " → 主题待定"));
        else if (d.status === "duplicate") dupMsg.push(d.file + "（" + (d.note || "重复") + "）");
        else if (d.status === "error") errMsg.push(d.file + "：" + (d.note || "失败"));
      });
      const skipped = s.skipped ? ["⚠️ 超过单批上限跳过 " + s.skipped + " 个"] : [];
      if (skipped.length) addMsg(skipped.join("；"), "bot");
      if (data.ingest_started) pollIngest();
    }
  } catch (e) {
    errMsg.push("请求失败：" + e);
  }
  if (doneNames.length) addMsg("🤖 自动入库中：" + doneNames.join("、"), "bot");
  if (pendingNames.length) addMsg("📋 已进入待审查：" + pendingNames.join("、") + "。点击右上角「待审查」确认入库。", "bot");
  if (dupMsg.length) addMsg("🔁 已跳过重复：" + dupMsg.join("、"), "bot");
  if (errMsg.length) addMsg("⚠️ 失败：" + errMsg.join("；"), "bot");
  refreshPending();
}

// ---- 待审查面板 ----
function togglePending() {
  const p = document.getElementById("pendingPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
  if (p.style.display !== "none") refreshPending();
}

async function refreshPending() {
  try {
    const res = await fetch("/api/pending");
    const data = await res.json();
    const list = data.pending || [];
    const btn = document.getElementById("pendingBtn");
    const countEl = document.getElementById("pendingCount");
    const box = document.getElementById("pendingList");
    if (list.length) {
      btn.style.display = "";
      countEl.textContent = list.length;
    } else {
      btn.style.display = "none";
    }
    box.innerHTML = list.length ? "" : "<div style='color:#7a8096;font-size:13px'>没有待审查文件</div>";
    list.forEach(item => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #3a3a52";
      const tagLine = (item.tags && item.tags.length)
        ? "<div style='flex-basis:100%;font-size:11px;color:#7a8096;padding-left:26px'>🏷 " + item.tags.map(t => "<span style='background:#2a2a40;border-radius:4px;padding:1px 6px;margin-right:4px'>" + t + "</span>").join("") + "</div>"
        : "";
      row.innerHTML =
        "<span style='flex:0 0 auto;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px'>📄 " + item.filename + "</span>" +
        "<input id='topic_" + item.filename + "' value='" + (item.suggest_topic || "") + "' placeholder='主题（可改）' style='flex:1;background:#1e1e2e;border:1px solid #3a3a52;border-radius:6px;padding:4px 8px;color:#e8e8f0;font-size:13px'>" +
        "<button onclick='reviewApprove(this)' data-file='" + item.filename + "' style='background:#4c6ef5;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px'>✓ 确认入库</button>" +
        "<button onclick='reviewReject(this)' data-file='" + item.filename + "' style='background:#3a3a52;color:#ff8787;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px'>✕ 丢弃</button>" +
        tagLine;
      box.appendChild(row);
    });
  } catch (e) { /* 服务没起时忽略 */ }
}

async function reviewApprove(btn) {
  const file = btn.getAttribute("data-file");
  const topicInput = document.getElementById("topic_" + file);
  const topic = topicInput.value.trim();
  if (!topic) { alert("请填写主题目录名"); return; }
  btn.disabled = true; btn.textContent = "入库中…";
  try {
    const res = await fetch("/api/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: file, topic: topic }),
    });
    const data = await res.json();
    if (res.ok) {
      addMsg("入库中：" + file + " → [" + topic + "]", "bot");
      pollIngest();
    } else { alert("失败：" + (data.detail || "未知")); }
  } catch (e) { alert("请求失败：" + e); }
  refreshPending();
}

async function reviewReject(btn) {
  const file = btn.getAttribute("data-file");
  if (!confirm("丢弃 " + file + "？")) return;
  try {
    await fetch("/api/pending", {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: file }),
    });
  } catch (e) { }
  refreshPending(); stats();
}

// ---- 参考来源：按文件聚合 + 可折叠 ----
function renderSources(sources) {
  // 去掉欢迎块（来源一定出现在问答后）
  const welcome = document.querySelector(".welcome");
  if (welcome) welcome.remove();

  const wrap = document.createElement("div");
  wrap.className = "source";
  wrap.style.cssText = "align-self:flex-start;max-width:85%;margin-top:2px";

  // 按 source 文件名聚合
  const groups = {};
  sources.forEach(s => {
    (groups[s.source] = groups[s.source] || []).push(s);
  });
  const files = Object.keys(groups);

  // 折叠头：默认一行
  const head = document.createElement("div");
  head.style.cssText = "cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px";
  head.innerHTML = "<span>📎 参考来源（" + files.length + " 篇）</span><span id='srcArrow' style='color:#7a8096'>▶</span>";
  head.onclick = () => {
    const body = wrap.querySelector(".src-body");
    const arrow = head.querySelector("#srcArrow");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "block";
    arrow.textContent = open ? "▶" : "▼";
  };
  wrap.appendChild(head);

  // 明细体：每篇文件一行（含片段数），展开显示该文件各片段
  const body = document.createElement("div");
  body.className = "src-body";
  body.style.cssText = "display:none;margin-top:6px;border-left:2px solid #3a3a52;padding-left:10px";
  files.forEach(fname => {
    const items = groups[fname];
    // 每篇一个可再展开的组
    const fileDiv = document.createElement("div");
    fileDiv.style.cssText = "margin:4px 0";
    const best = Math.max(...items.map(s => s.score)).toFixed(3);
    const fileHead = document.createElement("div");
    fileHead.style.cssText = "cursor:pointer;color:#9aa0b4";
    fileHead.innerHTML = "📄 " + fname + " <span style='color:#69db7c'>" + items.length + " 段 · 最高 " + best + "</span> <span style='color:#7a8096'>▶</span>";
    fileHead.onclick = () => {
      const list = fileDiv.querySelector(".src-list");
      const arrow = fileHead.querySelector("span:last-child");
      const open = list.style.display !== "none";
      list.style.display = open ? "none" : "block";
      arrow.textContent = open ? "▶" : "▼";
    };
    fileDiv.appendChild(fileHead);
    const list = document.createElement("div");
    list.className = "src-list";
    list.style.cssText = "display:none;margin:2px 0 2px 14px;color:#7a8096";
    items.forEach(s => {
      const line = document.createElement("div");
      line.style.cssText = "margin:2px 0;word-break:break-all";
      const h = (s.heading || "").replace(/^#+\s*/, "").slice(0, 30);
      line.textContent = "· " + (h || "(片段)") + " — 相似度 " + s.score.toFixed(3);
      list.appendChild(line);
    });
    fileDiv.appendChild(list);
    body.appendChild(fileDiv);
  });
  wrap.appendChild(body);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---- 入库进度条 ----
let progTimer = null;

function _fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function showProg(stage, pct, current, elapsed, eta, done, total) {
  // 兼容老调用：showProg(stage, pct)
  if (typeof current === "undefined" && typeof stage === "object" && stage) {
    const d = stage;
    return showProg(d.stage, d.percent, d.current, d.elapsed, d.eta, d.done, d.total);
  }
  const w = document.getElementById("progWrap");
  w.style.display = "block";
  document.getElementById("progStage").textContent = stage || "";
  document.getElementById("progPct").textContent = (pct || 0) + "%";
  document.getElementById("progBar").style.width = (pct || 0) + "%";
  // 当前操作：done/total + current
  let curText = "";
  if (done && total) curText = `${done}/${total} · `;
  curText += (current || "").trim();
  document.getElementById("progCurrent").textContent = curText || "—";
  // 用时 + 剩余
  const t = _fmtTime(elapsed);
  const etaTxt = (pct >= 100 || !eta) ? "完成" : `剩余 ${_fmtTime(eta)}`;
  document.getElementById("progTime").textContent = `用时 ${t} · ${etaTxt}`;
}

function hideProg() {
  const w = document.getElementById("progWrap");
  setTimeout(() => { w.style.display = "none"; }, 400);   // 完成后再停留一会
}

// 轮询后台入库进度，直到结束
function pollIngest(onDone) {
  showProg("排队中…", 0, "", 0, 0, 0, 0);
  if (progTimer) clearInterval(progTimer);
  progTimer = setInterval(async () => {
    try {
      const res = await fetch("/api/ingest/progress");
      const d = await res.json();
      showProg(d.stage, d.percent, d.current, d.elapsed, d.eta, d.done, d.total);
      if (!d.running) {
        clearInterval(progTimer); progTimer = null;
        if (d.error) {
          addMsg("⚠️ 入库出错：" + d.error, "bot");
        } else if (d.result) {
          const s = d.result;
          addMsg("✅ 入库完成：新增" + s.new + " 修改" + s.changed +
                 " 未变" + s.unchanged + " 删除" + s.removed + "，片段 " + s.chunks +
                 (s.elapsed ? "，用时 " + s.elapsed + " 秒" : ""), "bot");
        }
        hideProg();
        if (onDone) onDone();
        stats();
      }
    } catch (e) { /* 忽略瞬时错误 */ }
  }, 600);
}

async function ingest() {
  showProg("开始导入…", 3);
  try {
    const res = await fetch("/api/ingest", { method: "POST" });
    await res.json();
    pollIngest();
  } catch (e) {
    hideProg();
    addMsg("⚠️ 导入请求失败：" + e, "bot");
  }
}

async function stats() {
  try {
    const res = await fetch("/api/stats");
    const data = await res.json();
    document.getElementById("stats").textContent = "库内 " + data.chunks + " 片段";
  } catch (e) { }
}

// ---- 多会话管理：会话列表在后端（持久化），当前会话 id 存 localStorage ----
function getSessionId() {
  let sid = localStorage.getItem("kb_session_id");
  if (!sid) { sid = "s_demo_default"; }
  return sid;
}

function setCurSession(sid, name) {
  localStorage.setItem("kb_session_id", sid);
  const el = document.getElementById("curSessName");
  if (el) el.textContent = name ? " · " + name.slice(0, 8) : "";
}

async function newSession() {
  try {
    const res = await fetch("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: "新会话" }),
    });
    const data = await res.json();
    setCurSession(data.session_id, data.title);
    resetChatArea();
    addMsg("🆕 已创建新会话，之前的会话还在列表里。", "bot");
    loadSessionList();
  } catch (e) { alert("创建会话失败：" + e); }
}

// 切换会话：清空聊天区（历史从后端按需加载，UI 简单化：只显示当前会话新对话）
async function switchSession(sid, title) {
  setCurSession(sid, title);
  resetChatArea();
  addMsg("已切换到会话「" + (title || "新会话").slice(0, 15) + "」，开始提问吧。", "bot");
  document.getElementById("sessionPanel").style.display = "none";
}

function resetChatArea() {
  const chat = document.getElementById("chat");
  chat.innerHTML = '<div class="welcome"><h2>📚 个人知识库</h2><p>问我关于你笔记的任何问题</p></div>';
}

function toggleSessions() {
  const p = document.getElementById("sessionPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
  if (p.style.display !== "none") loadSessionList();
}

async function loadSessionList() {
  try {
    const res = await fetch("/api/sessions");
    const data = await res.json();
    const cur = getSessionId();
    const box = document.getElementById("sessionList");
    const list = data.sessions || [];
    if (!list.length) { box.innerHTML = "<div style='color:#7a8096;font-size:13px;padding:8px'>还没有会话</div>"; return; }
    box.innerHTML = "";
    list.forEach(s => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer";
      if (s.id === cur) row.style.background = "#3a3a52";

      // 用 DOM API + textContent 拼接，杜绝引号转义/注入问题
      const main = document.createElement("div");
      main.style.cssText = "flex:1;overflow:hidden";
      const t1 = document.createElement("div");
      t1.style.cssText = "font-size:13px;color:#e8e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
      t1.textContent = s.title || "新会话";
      const t2 = document.createElement("div");
      t2.style.cssText = "font-size:11px;color:#7a8096";
      t2.textContent = s.msg_count + " 条";
      main.appendChild(t1);
      main.appendChild(t2);
      main.addEventListener("click", () => switchSession(s.id, s.title));

      const del = document.createElement("button");
      del.textContent = "✕";
      del.title = "删除";
      del.style.cssText = "background:none;border:none;color:#ff8787;cursor:pointer;font-size:13px";
      del.addEventListener("click", e => { e.stopPropagation(); deleteSession(s.id); });

      row.appendChild(main);
      row.appendChild(del);
      box.appendChild(row);
    });
    // 显示当前会话名
    const curS = list.find(x => x.id === cur);
    const el = document.getElementById("curSessName");
    if (el) el.textContent = curS ? " · " + curS.title.slice(0, 8) : "";
  } catch (e) { /* 忽略 */ }
}

async function deleteSession(sid) {
  if (!confirm("删除这个会话及其历史？")) return;
  try {
    await fetch("/api/sessions/" + encodeURIComponent(sid), { method: "DELETE" });
    if (getSessionId() === sid) {
      // 删的是当前会话 → 回默认
      setCurSession("s_demo_default", "");
      resetChatArea();
    }
    loadSessionList();
  } catch (e) { }
}

async function send() {
  const input = document.getElementById("question");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  sendBtn.disabled = true;
  addMsg(q, "user");
  addMsg("思考中…", "bot");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id: getSessionId() }),
    });
    const data = await res.json();
    chatEl.lastElementChild.remove();
    addMsg(data.answer, "bot");
    if (data.sources && data.sources.length) {
      renderSources(data.sources);
    }
  } catch (err) {
    chatEl.lastElementChild.remove();
    addMsg("⚠️ 请求失败，请确认服务已启动", "bot");
  }
  sendBtn.disabled = false;
}

document.getElementById("question").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

stats();
refreshPending();
loadSessionList();
</script>
</body>
</html>
